{% extends "base.html" %}

{% block title %}发布新主题 - 花友居论坛{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">发布新主题</h2>
        <form method="post" class="space-y-4" enctype="multipart/form-data">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700">主题标题</label>
                <input type="text" name="title" id="title" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
            </div>
            <div>
                <label for="content" class="block text-sm font-medium text-gray-700">主题内容</label>
                <textarea name="content" id="content" rows="10" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500"></textarea>
            </div>
            <div class="mb-6">
                <label for="images" class="block text-gray-700 font-medium mb-2">上传图片</label>
                <input type="file" name="images" id="images" accept="image/*" multiple class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-full file:border-0
                    file:text-sm file:font-semibold
                    file:bg-green-50 file:text-green-700
                    hover:file:bg-green-100">
                <p class="mt-1 text-sm text-gray-500">支持上传多张图片（JPG、PNG、GIF），每张图片不超过16MB</p>
            </div>
            <div class="flex justify-end space-x-4">
                <a href="{{ url_for('forum', forum_id=forum_id) }}"
                    class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    取消
                </a>
                <button type="submit"
                    class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    发布
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
