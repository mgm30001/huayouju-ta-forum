{% extends "base.html" %}

{% block title %}发布新主题 - 花友居论坛{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">发布新主题</h2>
        <form method="post" class="space-y-4">
            <input type="hidden" name="image_urls" id="image_urls">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700">主题标题</label>
                <input type="text" name="title" id="title" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
            </div>
            <div>
                <label for="content" class="block text-sm font-medium text-gray-700">主题内容</label>
                <textarea name="content" id="content" rows="10" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500"></textarea>
            </div>
            <div class="mb-6">
                <label for="image_upload" class="block text-gray-700 font-medium mb-2">上传图片</label>
                <input type="file" id="image_upload" accept="image/*" multiple class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-full file:border-0
                    file:text-sm file:font-semibold
                    file:bg-green-50 file:text-green-700
                    hover:file:bg-green-100">
                <p class="mt-1 text-sm text-gray-500">支持上传多张图片（JPG、PNG、GIF）。图片将上传到图床并自动插入到内容中。</p>
                <div id="image_previews" class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-4"></div>
            </div>
            <div class="flex justify-end space-x-4">
                <a href="{{ url_for('forum', forum_id=forum_id) }}"
                    class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    取消
                </a>
                <button type="submit"
                    class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    发布
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Handle image uploads
    const imageUploadInput = document.getElementById('image_upload');
    imageUploadInput.addEventListener('change', function(event) {
        const files = event.target.files;
        const previewsContainer = document.getElementById('image_previews');
        const imageUrlsInput = document.getElementById('image_urls');
        const contentTextarea = document.getElementById('content');

        for (const file of files) {
            const formData = new FormData();
            formData.append('file', file);

            const previewId = `preview-${Date.now()}-${Math.random()}`;
            const previewElement = document.createElement('div');
            previewElement.id = previewId;
            previewElement.className = 'relative';
            previewElement.innerHTML = `<div class="w-full h-32 bg-gray-200 rounded-lg flex items-center justify-center">Uploading...</div>`;
            previewsContainer.appendChild(previewElement);

            fetch('/upload_image', { // Changed URL to proxy endpoint
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200 && data.data.url) {
                    const imageUrl = data.data.url;
                    
                    const uploadedPreview = document.getElementById(previewId);
                    uploadedPreview.innerHTML = `<img src="${imageUrl}" class="w-full h-32 object-cover rounded-lg">`;

                    const currentUrls = imageUrlsInput.value ? imageUrlsInput.value.split(',') : [];
                    currentUrls.push(imageUrl);
                    imageUrlsInput.value = currentUrls.join(',');

                    const currentContent = contentTextarea.value;
                    const separator = currentContent.trim() === '' ? '' : '\n\n';
                    contentTextarea.value = currentContent + separator + `![Image](${imageUrl})`;
                } else {
                    const errorPreview = document.getElementById(previewId);
                    errorPreview.innerHTML = `<div class="w-full h-32 bg-red-100 text-red-700 rounded-lg flex items-center justify-center p-2">Upload Failed</div>`;
                    console.error('Upload failed:', data.message || 'Unknown error');
                }
            })
            .catch(error => {
                const errorPreview = document.getElementById(previewId);
                errorPreview.innerHTML = `<div class="w-full h-32 bg-red-100 text-red-700 rounded-lg flex items-center justify-center p-2">Upload Error</div>`;
                console.error('Upload error:', error);
            });
        }
    });
});
</script>
{% endblock %}
