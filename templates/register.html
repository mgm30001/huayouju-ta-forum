{% extends "base.html" %}

{% block title %}注册 - 花友居论坛{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="apple-card p-8">
        <h2 class="text-2xl font-semibold text-white mb-8 text-center">用户注册</h2>
        <form method="post" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 mb-1.5">用户名</label>
                <input type="text" name="username" id="username" required class="apple-input">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1.5">密码</label>
                <input type="password" name="password" id="password" required class="apple-input">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-1.5">电子邮箱</label>
                <input type="email" name="email" id="email" required class="apple-input">
            </div>
            <div>
                <button type="submit" class="apple-btn w-full py-3 text-base">
                    注册
                </button>
            </div>
        </form>
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-500">
                已有账号？
                <a href="{{ url_for('login') }}" class="apple-link">立即登录</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
