{% extends "base.html" %}

{% block title %}找回密码 - 花友居论坛{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="apple-card p-8">
        <h2 class="text-2xl font-semibold text-white mb-8 text-center">找回密码</h2>
        <form method="post" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-1.5">注册邮箱</label>
                <input type="email" name="email" id="email" required class="apple-input" placeholder="输入注册时使用的邮箱">
            </div>
            <div>
                <button type="submit" class="apple-btn w-full py-3 text-base">生成重置链接</button>
            </div>
        </form>
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-500">
                想起密码了？
                <a href="{{ url_for('login') }}" class="apple-link">返回登录</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
