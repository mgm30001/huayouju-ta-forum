{% extends "base.html" %}

{% block title %}重置密码 - 花友居论坛{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="apple-card p-8">
        <h2 class="text-2xl font-semibold text-white mb-8 text-center">重置密码</h2>
        <form method="post" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="token" value="{{ token }}">
            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1.5">新密码</label>
                <input type="password" name="password" id="password" required class="apple-input" minlength="6">
            </div>
            <div>
                <label for="confirm" class="block text-sm font-medium text-gray-300 mb-1.5">确认新密码</label>
                <input type="password" name="confirm" id="confirm" required class="apple-input" minlength="6">
            </div>
            <div>
                <button type="submit" class="apple-btn w-full py-3 text-base">重置密码</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
