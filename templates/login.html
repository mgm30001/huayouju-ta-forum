{% extends "base.html" %}

{% block title %}登录 - 花友居论坛{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="apple-card p-8">
        <h2 class="text-2xl font-semibold text-white mb-8 text-center">用户登录</h2>
        <form method="post" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 mb-1.5">用户名</label>
                <input type="text" name="username" id="username" required class="apple-input">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1.5">密码</label>
                <input type="password" name="password" id="password" required class="apple-input">
            </div>
            <div>
                <button type="submit" class="apple-btn w-full py-3 text-base">
                    登录
                </button>
            </div>
        </form>
        <div class="mt-6 text-center space-y-2">
            <p class="text-sm text-gray-500">
                还没有账号？
                <a href="{{ url_for('register') }}" class="apple-link">立即注册</a>
            </p>
            <p class="text-xs text-gray-400">
                <a href="{{ url_for('forgot_password') }}" class="hover:text-gray-600">忘记密码？</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
